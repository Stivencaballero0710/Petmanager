name: Integridad de PetManager

on:
  push:
    branches: [main]
    paths:
      - 'SQL/**/*.sql'
      - '.github/workflows/integridad_sql.yml'
  workflow_dispatch:

jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: petmanager_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppetmanager_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Preparar MySQL
        run: |
          if ! command -v mysql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y mysql-client
          fi
      - name: Crear tablas, cargar datos y ejecutar consultas
        env:
          MYSQL_PWD: petmanager_test
        run: |
          mysql -h127.0.0.1 -uroot < SQL/01_Creacion_de_base_de_datos/crear_base_de_datos.sql
          mysql -h127.0.0.1 -uroot < SQL/02_Creacion_de_tablas/basededatosVeterinaria.sql
          mysql -h127.0.0.1 -uroot < SQL/04_Insercion_de_datos/registros.sql
          mysql -h127.0.0.1 -uroot < SQL/05_Consultas/consultas.sql > /dev/null
      - name: Comprobar integridad y resultados
        env:
          MYSQL_PWD: petmanager_test
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          
          base = ['mysql', '-h127.0.0.1', '-uroot', '-N', '-B', 'petmanager']
          def count(sql):
              return int(subprocess.run(base + ['-e', sql], check=True, capture_output=True, text=True).stdout.strip())
          
          tables = {'veterinaria':10,'sucursal':10,'inventario':10,'elemento_medico':10,'medicamento':10,'empleado':30,'veterinario':10,'secretario':10,'auxiliar':10,'cliente':10,'factura':10,'animal':10,'historial_clinico':10,'registro_clinico':40,'cita':10,'vacunacion':10,'tratamiento':10,'hospitalizacion':10}
          assert count("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='petmanager' AND table_type='BASE TABLE'") == 18
          assert count("SELECT COUNT(*) FROM information_schema.key_column_usage WHERE table_schema='petmanager' AND referenced_table_name IS NOT NULL") == 17
          for name, expected in tables.items():
              actual = count(f'SELECT COUNT(*) FROM `{name}`')
              assert actual == expected, f'{name}: {actual} registros; esperados {expected}'
          assert sum(tables.values()) == 230
          
          text = Path('SQL/05_Consultas/consultas.sql').read_text(encoding='utf-8')
          text = '\n'.join(line for line in text.splitlines() if not line.strip().startswith('--'))
          statements = [s.strip() for s in text.split(';') if s.strip()]
          queries = [s for s in statements if s.upper().startswith('SELECT')]
          expected = [3, 2, 5, 10, 28, 6, 10, 10, 3, 3]
          assert len(queries) == len(expected), f'Se encontraron {len(queries)} consultas'
          for number, (query, amount) in enumerate(zip(queries, expected), 1):
              actual = count(f'SELECT COUNT(*) FROM ({query}) AS resultado')
              assert actual == amount, f'Consulta {number}: {actual} filas; esperadas {amount}'
          print('Esquema, datos y diez consultas correctos.')
          PY
